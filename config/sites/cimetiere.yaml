# Site « cimetiere » : le terrain de vol habituel. La cible se compte depuis le home, là où le
# pilote arme : il arme donc toujours au même endroit du terrain.
# Décalage approximatif, à remplacer par une mesure faite sur place.
/**:
  ros__parameters:
    site: cimetiere
    target: {north_m: 90.0, east_m: 95.0}   # la cible, en mètres au nord et à l'est du home
    altitude_agl: 10.0                       # hauteur de travail au-dessus du home, mètres
